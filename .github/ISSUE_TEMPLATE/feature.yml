name: 기능 개발
description: 새로운 기능이나 화면 구현을 제안하고 작업 범위를 정의합니다.
title: '[FEAT] '
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        작업 목적과 완료 조건을 구체적으로 작성해 주세요.

  - type: textarea
    id: summary
    attributes:
      label: 작업 목적
      description: 이 기능이 필요한 이유와 해결하려는 문제를 작성해 주세요.
      placeholder: 사용자가 찜한 혜택을 한 화면에서 확인할 수 있도록 합니다.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 상세 작업 내용
      description: 구현할 작업을 체크리스트로 작성해 주세요.
      value: |
        - [ ] UI 구현
        - [ ] 상태 및 사용자 흐름 연결
        - [ ] 반응형·접근성 확인
        - [ ] 빌드·린트 확인
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 이슈를 완료로 판단할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - 사용자가 찜한 혜택 목록을 확인할 수 있습니다.
        - 빈 목록일 때 안내 화면이 표시됩니다.
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: 디자인 및 참고 자료
      description: Figma, API 명세 또는 관련 문서 링크를 입력해 주세요.
      placeholder: https://www.figma.com/...

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 의존 작업, 주의점 또는 리뷰어가 알아야 할 내용을 작성해 주세요.
