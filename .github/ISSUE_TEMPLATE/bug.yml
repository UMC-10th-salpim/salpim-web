name: 버그 수정
description: 재현 가능한 오류를 보고하고 수정 범위를 정의합니다.
title: '[FIX] '
labels: []
assignees: []
body:
  - type: textarea
    id: bug
    attributes:
      label: 문제 설명
      description: 현재 발생하는 문제를 구체적으로 작성해 주세요.
      placeholder: 마이페이지에서 하단 내비게이션이 콘텐츠를 가립니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 순서를 작성해 주세요.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 기기, OS, 브라우저와 화면 크기를 작성해 주세요.
      placeholder: iPhone 15 / iOS / Safari / 393×852
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: 스크린샷 및 로그
      description: 개인정보를 제거한 스크린샷이나 오류 메시지를 첨부해 주세요.
